aid: infosys
name: Infosys
description: >-
  Infosys is a global IT services, consulting, and outsourcing company
  headquartered in Bengaluru, India, providing digital transformation,
  cloud, AI, and business process services. Through its Finacle banking
  software product and Banking API Platform, Infosys exposes open banking
  APIs for deposits, loans, payments, trade finance, and data privacy,
  along with a configurable developer portal, API composer, and consent
  management. A public Finacle Open Bank Project sandbox is also
  available for developers to explore banking APIs.
